name: last-ticket-go-demo

x-app: &app
  image: last-ticket-go-demo:local
  pull_policy: never
  init: true
  stop_grace_period: 20s
  environment:
    KAFKA_BROKERS: kafka:9092
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  kafka-storage-init:
    image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    command: [chown, '1000:1000', /kafka-data]
    volumes: [kafka-data:/kafka-data]
  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    environment:
      JAVA_TOOL_OPTIONS: -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: '6000'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, /init/kafka-init.sh]
    volumes: [./scripts/kafka-init.sh:/init/kafka-init.sh:ro]
  orders:
    <<: *app
    build: .
    command: [--service=orders]
    volumes: [orders-data:/data]
    healthcheck:
      test: [CMD, demo, --service=orders, --mode=probe]
      interval: 3s
      timeout: 3s
      retries: 30
  payments:
    <<: *app
    command: [--service=payments]
    volumes: [payments-data:/data]
    healthcheck:
      test: [CMD, demo, --service=payments, --mode=probe]
      interval: 3s
      timeout: 3s
      retries: 30
  reservations:
    <<: *app
    command: [--service=reservations]
    volumes: [reservations-data:/data]
    healthcheck:
      test: [CMD, demo, --service=reservations, --mode=probe]
      interval: 3s
      timeout: 3s
      retries: 30
  demo-web:
    <<: *app
    command: [--service=demo-web]
    volumes: [demo-web-data:/data]
    healthcheck:
      test: [CMD, demo, --service=demo-web, --mode=probe]
      interval: 3s
      timeout: 3s
      retries: 30
    ports: ['127.0.0.1:${DEMO_PORT:-8080}:8080']

volumes:
  kafka-data:
  orders-data:
  payments-data:
  reservations-data:
  demo-web-data:
